name: juya-admin-test

# 测试环境仅接收 GitHub test 分支。ECS_TEST_MACHINE_GROUP_ID 在云效 Flow 的
# “变量和缓存”中配置，值为承载 8.163.84.24 的测试主机组 ID。
stages:
  quality_stage:
    name: 测试环境质量门禁
    jobs:
      quality_job:
        name: 校验、测试与构建
        runsOn:
          group: public/cn-hangzhou
          container: node:22.22.0-bookworm-slim
        steps:
          quality_step:
            name: test 分支质量门禁
            step: Command
            with:
              run: |
                set -eu
                test "${CI_COMMIT_REF_NAME}" = "test"
                corepack enable
                corepack prepare pnpm@11.22.0 --activate
                pnpm install --frozen-lockfile
                pnpm check
                pnpm test
                pnpm build
          upload_step:
            name: 上传测试静态制品
            step: ArtifactUpload
            with:
              uploadType: flowPublic
              artifact: juya_admin_test_web
              filePath:
                - dist/
                - deploy/

  deploy_stage:
    name: 部署测试 ECS
    jobs:
      deploy_job:
        name: 发布测试静态站点
        component: VMDeploy
        with:
          artifact: $[stages.quality_stage.quality_job.upload_step.artifacts.juya_admin_test_web]
          machineGroup: ${ECS_TEST_MACHINE_GROUP_ID}
          artifactDownloadPath: /tmp/juya-admin-test.tgz
          executeUser: root
          run: |
            set -eu
            test "${CI_COMMIT_REF_NAME}" = "test"
            test -n "${BUILD_NUMBER}"
            test -n "${CI_COMMIT_SHA}"
            staging="$(mktemp -d /tmp/juya-admin-test.XXXXXX)"
            trap 'rm -rf "$staging"' EXIT
            tar xzf /tmp/juya-admin-test.tgz -C "$staging"
            chmod 0555 "$staging/deploy/ecs-deploy.sh" "$staging/deploy/environment.sh"
            "$staging/deploy/ecs-deploy.sh" test test "${BUILD_NUMBER}-${CI_COMMIT_SHA}" "$staging"
