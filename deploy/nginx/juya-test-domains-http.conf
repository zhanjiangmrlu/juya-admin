# Test domains only. Miniapp API and H5 are reserved until their services are deployed.
server {
    listen 80;
    server_name test-admin.juyayingyu.com;
    root /opt/juya/juya-admin-web;
    index index.html;
    client_max_body_size 20m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/juya-acme;
        try_files $uri =404;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health/ready { proxy_pass http://127.0.0.1:8000; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 80;
    server_name test-admin-api.juyayingyu.com;
    client_max_body_size 20m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/juya-acme;
        try_files $uri =404;
    }
    location /api/v1/admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health/ready { proxy_pass http://127.0.0.1:8000; }
    location / { return 404; }
}
server {
    listen 80;
    server_name test-api.juyayingyu.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/juya-acme;
        try_files $uri =404;
    }
    location / {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"status":"not_deployed","service":"juya-miniapp-api","environment":"test"}';
    }
}
server {
    listen 80;
    server_name test-h5.juyayingyu.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/juya-acme;
        try_files $uri =404;
    }
    location / {
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-store" always;
        return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>句芽英语测试环境</title><main style="max-width:36rem;margin:15vh auto;padding:24px;font-family:system-ui"><h1>测试 H5 尚未部署</h1><p>域名已准备好，用户端网页部署后将在此开放。</p></main></html>';
    }
}
